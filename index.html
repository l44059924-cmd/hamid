<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRAGON ROYAL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>
<div class="bg-glow"></div>

<header>
<h1>DRAGON ROYAL</h1>
<p>BLACK • GOLD • IMPERIAL EDITION</p>
<a href="#watch" class="btn">DISCOVER</a>
</header>

<main id="watch">

<section class="hero">

<div class="watch-scene">

<div class="watch" id="watch3d">

<div class="strap top"></div>

<div class="case">

<div class="bezel"></div>

<div class="glass"></div>

<div class="shine"></div>

<div class="dial">

<div class="dragon"></div>

<div class="center"></div>

<div class="ticks"></div>

<div class="hand hour"></div>
<div class="hand minute"></div>
<div class="hand second"></div>

</div>

</div>

<div class="strap bottom"></div>

</div>

</div>

<div class="content">

<h2>Forged For Kings</h2>

<p>
Handcrafted illusion of black titanium,
24K royal gold,
dragon engraved dial,
floating sapphire crystal
and ceremonial luxury.
</p>

<div class="cards">

<div class="card">
<h3>ROYAL GOLD</h3>
<span>24K Finish</span>
</div>

<div class="card">
<h3>SAPPHIRE</h3>
<span>Crystal Dome</span>
</div>

<div class="card">
<h3>DRAGON</h3>
<span>Imperial Engraving</span>
</div>

</div>

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
